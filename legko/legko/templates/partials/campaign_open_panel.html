<div class="modal-panel modal-panel--open">
  <h2 class="modal-title" id="open-modal-title">Открыть кампанию</h2>
  <p class="text-muted text-muted--compact">Переход в редактор Legko. При первом открытии кампания подтянется из Keitaro.</p>
  <p class="open-campaign-summary">
    <strong>{{ campaign_name }}</strong><br />
    <span class="text-muted">Keitaro #{{ keitaro_campaign_id }}</span>
  </p>
  <form method="post" action="/campaigns/open" class="open-campaign-modal-form">
    <input type="hidden" name="keitaro_campaign_id" value="{{ keitaro_campaign_id }}" />
    <div class="modal-actions field-row field-row--actions">
      <button type="button" class="btn-secondary" data-modal-close>Отмена</button>
      <button type="submit" class="btn-primary">Open</button>
    </div>
  </form>
</div>
